<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Longbox — Comic Reader</title>
<meta name="theme-color" content="#0d0d0f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===================== LIBRARY ===================== -->
<main id="library-view" class="view active">

  <div id="library-root">
    <div class="lib-header">
      <h1 class="lib-title">Longbox<span class="dot">.</span></h1>
      <span class="lib-count" id="lib-count"></span>
    </div>

    <div class="toolbar" id="lib-toolbar" style="display:none;">
      <div class="pill-row" id="sort-row">
        <button class="pill" data-sort="recent">Recent</button>
        <button class="pill" data-sort="title">Title</button>
        <button class="pill" data-sort="unread">Unread</button>
        <button class="pill" data-sort="progress">In progress</button>
      </div>
      <div class="pill-row">
        <button class="ghost-btn" id="detect-series-btn">Detect Series</button>
        <button class="ghost-btn" id="new-collection-btn">+ Collection</button>
      </div>
    </div>

    <div class="empty-state halftone" id="empty-state" style="display:none;">
      <h2>Your longbox is empty</h2>
      <p>Import a .cbz file to start reading. Everything stays on this device.</p>
      <button class="import-btn" id="empty-import-btn">+ Import CBZ</button>
    </div>

    <div class="comic-grid" id="comic-grid" style="display:none;"></div>
  </div>

  <div id="collection-view" style="display:none;">
    <div class="lib-header collection-header">
      <button class="reader-btn dark-btn" id="collection-back">←</button>
      <h1 class="lib-title collection-title" id="collection-title"></h1>
      <button class="reader-btn dark-btn" id="collection-menu">⋮</button>
    </div>
    <div class="lib-count" id="collection-count" style="margin: 0 0 16px;"></div>
    <div class="comic-grid" id="collection-grid"></div>
  </div>

  <input type="file" id="import-input" accept=".cbz,.zip,application/zip,application/x-cbz,application/vnd.comicbook+zip,application/octet-stream" multiple style="display:none" />
</main>

<button class="import-btn" id="fab-import" style="position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); border-radius:50px; z-index:40;">+ Import</button>

<div class="import-progress" id="import-progress">
  <div class="spinner"></div>
  <span id="import-progress-text">Importing…</span>
</div>

<!-- ===================== MODAL ===================== -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- ===================== READER ===================== -->
<section id="reader-view" class="view">
  <div class="reader-stage" id="reader-stage">
    <div class="page-viewport" id="page-viewport"></div>
    <div class="reader-tap-zones">
      <div class="tap-zone"></div>
      <div class="tap-zone"></div>
    </div>
    <div class="reader-loading" id="reader-loading" style="display:none;">
      <div class="spinner"></div>
      <span>Loading page…</span>
    </div>
  </div>

  <div class="bookmark-flag" id="bookmark-flag" style="display:none;">
    <span class="reg-mark"><span class="reg-mark-ring"></span></span>
  </div>

  <div class="reader-chrome visible" id="reader-chrome">
    <div class="reader-topbar">
      <button class="reader-btn" id="reader-back">←</button>
      <span class="reader-title" id="reader-title"></span>
      <button class="reader-btn" id="reader-bookmark"><span class="reg-mark"><span class="reg-mark-ring"></span></span></button>
    </div>
    <div class="reader-bottombar">
      <div class="page-slider-row">
        <input type="range" id="page-slider" min="0" max="0" value="0" step="1" />
        <span id="page-slider-label">1 / 1</span>
      </div>
      <div class="page-slider-row">
        <div class="reader-modes">
          <button class="mode-pill" data-mode="single">Page</button>
          <button class="mode-pill" data-mode="spread">Spread</button>
          <button class="mode-pill" data-mode="scroll">Scroll</button>
        </div>
        <div class="theme-row">
          <button class="theme-swatch dark" data-theme="dark" title="Dark"></button>
          <button class="theme-swatch sepia" data-theme="sepia" title="Sepia"></button>
          <button class="theme-swatch light" data-theme="light" title="Light"></button>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/db.js"></script>
<script src="js/library.js"></script>
<script src="js/reader.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("fab-import").addEventListener("click", () => {
    document.getElementById("import-input").click();
  });
  document.getElementById("empty-import-btn").addEventListener("click", () => {
    document.getElementById("import-input").click();
  });
</script>
</body>
</html>
